name: One-time PDF export

on:
  push:
    paths:
      - '.github/workflows/one-time-pdf-export.yml'

permissions:
  contents: write

jobs:
  export-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/ultimate-aa-http.log 2>&1 &
          sleep 2

      - name: Export public front side to PDF
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found"
            exit 1
          fi
          "$CHROME" \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --no-pdf-header-footer \
            --virtual-time-budget=10000 \
            --print-to-pdf="Ultimate-AA-Front-Side.pdf" \
            http://127.0.0.1:8000/
          test -s Ultimate-AA-Front-Side.pdf

      - name: Commit PDF and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-pdf-export.yml
          git add Ultimate-AA-Front-Side.pdf
          git commit -m "Export current Ultimate AA front side PDF"
          git push
