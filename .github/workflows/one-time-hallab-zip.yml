name: One-time Hallab Education ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-hallab-zip.yml'

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out export branch
        uses: actions/checkout@v4
        with:
          ref: hallab-theme-export

      - name: Build themed files
        run: python3 tools/build_hallab_export.py

      - name: Package Netlify-ready ZIP
        shell: bash
        run: |
          mkdir -p hallab-export/assets
          cp index.html netlify.toml HALLAB-README.txt hallab-export/
          cp -R admin content hallab-export/
          [ -f README.md ] && cp README.md hallab-export/ || true
          [ -f SETUP.md ] && cp SETUP.md hallab-export/ || true
          cd hallab-export
          zip -r ../Hallab-Education-Ultimate-AA.zip . >/dev/null

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallab-education-ultimate-aa
          path: Hallab-Education-Ultimate-AA.zip
          if-no-files-found: error

      - name: Remove one-time workflow from main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-hallab-zip.yml
          git commit -m "Clean Hallab ZIP export workflow [skip netlify]"
          git push
