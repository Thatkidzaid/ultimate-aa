name: Extract CMS package

on:
  push:
    paths:
      - '.github/workflows/extract-cms.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract uploaded CMS package
        run: |
          unzip -o Ultimate-AA-CMS-Starter-GitHub-Configured.zip
          rm -f Ultimate-AA-CMS-Starter-GitHub-Configured.zip
          rm -f .github/workflows/extract-cms.yml
      - name: Commit extracted site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set up tutor-editable Ultimate AA site"
          git push origin main
