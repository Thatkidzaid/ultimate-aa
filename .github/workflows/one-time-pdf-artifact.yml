name: One-time PDF artifact

on:
  push:
    paths:
      - '.github/workflows/one-time-pdf-artifact.yml'

permissions:
  contents: write

jobs:
  package-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-aa-front-side-pdf
          path: Ultimate-AA-Front-Side.pdf
          if-no-files-found: error
      - name: Record run and remove workflow
        shell: bash
        run: |
          echo "${{ github.run_id }}" > pdf-artifact-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-pdf-artifact.yml
          git add pdf-artifact-run-id.txt
          git commit -m "Package Ultimate AA PDF artifact"
          git push
