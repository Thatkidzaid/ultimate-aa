name: One-time browser title fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-title-fix.yml'

permissions:
  contents: write

jobs:
  fix-title:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct browser tab title
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<title>Ultimate AA Key To Sucess</title>'
          new = '<title>Ultimate AA Key To Success</title>'
          if old not in s:
              raise SystemExit('Expected misspelled title not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit title fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-title-fix.yml
          git add index.html
          git commit -m "Fix browser tab spelling: Success"
          git push
