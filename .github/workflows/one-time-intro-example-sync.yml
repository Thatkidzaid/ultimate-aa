name: One-time introduction example sync

on:
  push:
    paths:
      - '.github/workflows/one-time-intro-example-sync.yml'

permissions:
  contents: write

jobs:
  sync-example:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update public fallback introduction example
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'Ubiquitous within modern society lies the need for individuals to be cognisant of the environment due to its potentially fatal consequences, bringing into question whether or not legislators should enforce harsher penalties on wexters.': 'Ubiquitous within modern society lies the need for students to remain focused within learning environments, bringing into question whether mobile phones should be restricted during class.',
            'In light of this, Bob stridently contends that ‘wexting’ must be abolished as it poses fatal consequences upon those who partake in it within his opinion piece entitled “John Wick 3”': 'In light of this, Sarah Miller firmly contends that mobile phones should be restricted during class as they pose a significant distraction to students within her opinion piece entitled “Put the Phones Away”.',
            'Appealing directly towards legislators, youth, and pedestrians, Bob ominously supplements his piece with an image of a young female walking on the footpath whilst using her phone in order to substantiate her piece.': 'Appealing directly towards parents, teachers and students, Miller supplements her piece with an image of a student distracted by their phone during class in order to substantiate her piece.',
            'Ultimately, Bob zealously calls for individuals to abort wexting as only then can true happiness emerge.': 'Ultimately, Miller strongly calls for schools to restrict mobile-phone use during class as only then can students remain focused and engaged in their learning.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing fallback text: {old[:60]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-intro-example-sync.yml
          git add index.html
          git commit -m "Sync clearer introduction example to public fallback"
          git push
